<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LAMINA — PCB design studio</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="css/app.css">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
</head>
<body>
<div id="app">
  <header id="menubar">
    <div class="brand"><span class="logo">▣</span> LAMINA <span class="ver">0.1</span></div>
    <nav id="menus"></nav>
    <div class="spacer"></div>
    <div id="docname" title="Document name">untitled</div>
    <div id="viewtabs">
      <button data-view="2d" class="on">2D</button>
      <button data-view="3d">3D</button>
    </div>
  </header>
  <div id="toolbar"></div>
  <div id="main">
    <aside id="left">
      <div class="panel" id="panel-tools"><h3>Tools</h3><div id="tools"></div></div>
      <div class="panel grow" id="panel-parts"><h3>Parts <input id="partsearch" placeholder="search…"></h3><div id="partlist"></div></div>
    </aside>
    <section id="center">
      <div id="boardtabs"></div>
      <div id="canvaswrap">
        <canvas id="canvas2d"></canvas>
        <div id="view3d" class="hidden"><canvas id="canvas3d"></canvas><div id="v3dbar"></div></div>
        <div id="hud"></div>
      </div>
      <div id="statusbar"><span id="st-coords">x 0.00  y 0.00</span><span id="st-grid"></span><span id="st-snap"></span><span id="st-zoom"></span><span id="st-msg"></span></div>
    </section>
    <aside id="right">
      <div class="panel" id="panel-layers"><h3>Layers</h3><div id="layers"></div></div>
      <div class="panel grow" id="panel-props"><h3 id="props-title">Properties</h3><div id="props"></div></div>
      <div class="panel" id="panel-drc"><h3>Checks <button id="btn-drc" class="mini">Run DRC</button></h3><div id="drclist"></div></div>
    </aside>
  </div>
</div>
<div id="modal-root"></div>
<input type="file" id="filein" hidden>
<script type="module" src="js/app.js"></script>
</body>
</html>
